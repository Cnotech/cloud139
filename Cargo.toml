[package]
name = "cloud139"
version = "2.3.1"
edition = "2024"
rust-version = "1.88"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
reqwest = { version = "0.13", features = ["json", "multipart", "stream", "cookies"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
toml = "1.1"
base64 = "0.22"
aes = "0.8"
sha1 = "0.11"
sha2 = "0.11"
md-5 = "0.11"
tokio = { version = "1.51", features = ["full"] }
directories = "5"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
anyhow = "1"
futures-util = "0.3"
hex = "0.4"
url = "2"
cbc = "0.1"
digest = "0.11"
typenum = "1.17"
rand = "0.8"
indicatif = "0.17"
glob = "0.3"
serde-xml-rs = "0.8"
filetime = "0.2"
fs2 = "0.4"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
httpmock = "0.8"
serde_json = "1"

[[bin]]
name = "cloud139"
path = "src/main.rs"
