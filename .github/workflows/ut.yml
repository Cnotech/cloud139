name: Unit Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Cache Rust crates
        uses: swatinem/rust-cache@v2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Check Rust source file lengths
        if: runner.os == 'Linux'
        run: python3 scripts/check-rust-file-length.py

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked

      - name: Run tests
        run: cargo test --workspace --locked --no-fail-fast
