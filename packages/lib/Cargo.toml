[package]
name = "cloud139"
description = "Rust client and file operations for China Mobile Cloud Drive"
license = "MIT"
repository = "https://github.com/Cnotech/cloud139"
version = "3.0.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
reqwest = { version = "0.13", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
toml = "1.1"
base64 = "0.22"
sha2 = "0.11"
md-5 = "0.11"
tokio = { version = "1.51", features = ["fs", "io-util", "rt", "sync", "time"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
thiserror = "2.0"
anyhow = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
log = "0.4"
rand = "0.8"
glob = "0.3"
serde-xml-rs = "0.8"
filetime = "0.2"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
httpmock = "0.8"
tokio = { version = "1.51", features = ["macros"] }
