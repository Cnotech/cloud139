[package]
name = "cloud139-cli"
version = "3.0.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
cloud139 = { path = "../lib", version = "3.0.0" }
clap = { version = "4.6", features = ["derive"] }
anstream = "1"
anyhow = "1"
thiserror = "2.0"
tokio = { version = "1.51", features = ["macros", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
toml = "1.1"
directories = "5"
indicatif = "0.17"
log = "0.4"

[target.'cfg(unix)'.dependencies]
fs2 = "0.4"

[target.'cfg(windows)'.dependencies]
sha2 = "0.11"
hex = "0.4"
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_System_Threading"] }

[dev-dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["now"] }
filetime = "0.2"
hex = "0.4"
httpmock = "0.8"
sha2 = "0.11"
tempfile = "3"
tokio = { version = "1.51", features = ["io-util", "net", "sync", "time"] }

[[bin]]
name = "cloud139"
path = "src/main.rs"
